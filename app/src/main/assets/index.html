I|Restaurante|🍴
I|Hotel|🛏`.split('\n').map(l=>l.split('|'));
// Infrações: descrição|natureza (l leve, m média, g grave, v gravíssima)
const IN=`Dirigir sob influência de álcool|v
Recusar-se a fazer o teste do bafômetro|v
Avançar o sinal vermelho do semáforo|v
Participar de corrida não autorizada em via pública (racha)|v
Dirigir sem possuir CNH|v
Deixar de prestar socorro à vítima de acidente|v
Transportar criança sem dispositivo de retenção adequado|v
Ultrapassar pela contramão em linha dupla contínua|v
Conduzir motocicleta sem usar capacete|v
Exceder em mais de 50% a velocidade máxima permitida|v
Deixar de dar preferência ao pedestre que está atravessando na faixa|v
Transitar com o veículo sobre a calçada|v
Dirigir sem usar o cinto de segurança|g
Exceder de 20% até 50% a velocidade máxima permitida|g
Exceder até 20% a velocidade máxima permitida|m
Deixar de sinalizar com a seta a mudança de direção|m
Parar o veículo sobre a faixa de pedestres na mudança de sinal|m
Deixar de manter acesa a luz baixa em rodovia durante o dia|m
Dirigir sem portar a CNH|l
Dirigir sem portar o documento de licenciamento do veículo|l
Usar a buzina de forma prolongada ou desnecessária|l`.split('\n').map(l=>l.split('|'));
function svg(t,g){const T=(s,c,f)=>`<text x="40" y="42" text-anchor="middle" dominant-baseline="central" font-size="${s}" font-weight="700" fill="${c}" font-family="Arial,sans-serif">${f}</text>`,z=g.length>2?20:30;let b;
if(t=='A')b=`<polygon points="40,3 77,40 40,77 3,40" fill="#ffd400" stroke="#111" stroke-width="4"/>`+T(z,'#111',g);
else if(t=='S')b=`<polygon points="25,4 55,4 76,25 76,55 55,76 25,76 4,55 4,25" fill="#d00" stroke="#fff" stroke-width="3"/>`+T(18,'#fff',g);
else if(t=='D')b=`<polygon points="4,10 76,10 40,74" fill="#fff" stroke="#d00" stroke-width="8" stroke-linejoin="round"/>`;
else if(t=='N')b=`<circle cx="40" cy="40" r="36" fill="#d00"/><rect x="14" y="33" width="52" height="14" fill="#fff"/>`;
else if(t=='O')b=`<circle cx="40" cy="40" r="36" fill="#0b5fb0"/>`+T(z,'#fff',g);
else if(t=='I')b=`<rect x="4" y="4" width="72" height="72" rx="6" fill="#0b5fb0" stroke="#fff" stroke-width="3"/>`+T(z,'#fff',g);
else{b=`<circle cx="40" cy="40" r="34" fill="${t=='E'||t=='B'?'#0b5fb0':'#fff'}" stroke="#d00" stroke-width="7"/>`+(g?T(z,'#111',g):'');
if(t=='X'||t=='E')b+=`<line x1="17" y1="17" x2="63" y2="63" stroke="#d00" stroke-width="6"/>`;
if(t=='B')b+=`<path d="M18 18L62 62M62 18L18 62" stroke="#d00" stroke-width="6"/>`}
return`<svg viewBox="0 0 80 80" role="img" aria-label="Placa de trânsito">${b}</svg>`}
const grp=t=>'RXEBNOSD'.includes(t)?0:t=='A'?1:2;
function mk(){const B=Q.slice();
SG.forEach(([t,n,g])=>{const w=sh(SG.filter(s=>grp(s[0])==grp(t)&&s[1]!=n)).slice(0,3),im=svg(t,g);
B.push(['A mensagem contida na placa ao lado é:',n,...w.map(s=>s[1]),im]);
B.push([`Qual placa indica: “${n}”?`,im,...w.map(s=>svg(s[0],s[2]))])});
IN.forEach(([d,c])=>{const o=Object.keys(NM).filter(k=>k!=c);
B.push([`A infração “${d}” é classificada como:`,NM[c],...o.map(k=>NM[k])]);
B.push([`Quantos pontos recebe o condutor que comete a infração “${d}”?`,PT[c]+' pontos',...o.map(k=>PT[k]+' pontos')])});
return B}
const fmt=s=>[s/60|0,s%60].map(v=>String(v).padStart(2,'0')).join(':');
const L='ABCD',MODES=[
{nome:'Teste rápido',n:10,time:0,fb:1,d:'10 perguntas sorteadas, com a resposta certa logo após cada questão. Sem cronômetro.'},
{nome:'Simulado com respostas',n:30,time:0,fb:1,d:'30 perguntas sorteadas, com a resposta certa após cada questão. Sem cronômetro.'},
{nome:'Prova simulada',n:30,time:50,fb:0,d:'30 perguntas sorteadas, 50 minutos e gabarito só no final.'}];
let S,M;
function home(){if(S)clearInterval(S.timer);$('#cnt').textContent=$('#tmr').textContent='';app.className='pg';app.innerHTML=`<h1>Escolha como quer praticar</h1><p class="lg">A cada tentativa as questões são sorteadas de um banco de ${mk().length} perguntas, em ordem e com alternativas diferentes.</p><div class="md">${MODES.map((m,i)=>`<button data-i="${i}"><b>${m.nome}</b><span>${m.d}</span></button>`).join('')}</div><p class="lg"><label>Importar mais perguntas (.json): <input type="file" id="im" accept=".json"></label></p>`;
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{M=MODES[b.dataset.i];M.time?login():intro()});$('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const a=JSON.parse(t).filter(r=>Array.isArray(r)&&r.length>=5&&r.slice(0,5).every(x=>typeof x=='string'));Q.push(...a);alert(a.length+' perguntas importadas.')}catch(x){alert('Arquivo inválido.')}home()})}}
function intro(){const min=Math.ceil(M.n*.7);
app.className='pg';app.innerHTML=`<h1>Simulado DETRAN|ES – ${M.nome}</h1><p>Prepare-se para a prova teórica da CNH com questões sobre legislação, sinalização, direção defensiva, primeiros socorros e meio ambiente.</p><p><b>Recomendações:</b></p><ul><li>A prova tem <b>${M.n} questões</b> de múltipla escolha, sorteadas do banco a cada tentativa.</li><li>Cada questão possui apenas 1 alternativa correta.</li><li>Selecione uma alternativa e clique em “Responder”.</li><li>${M.time?`Tempo de prova: <b>${M.time} minutos</b>.`:'Sem limite de tempo.'}</li><li>${M.fb?'Após responder, a linha da resposta certa fica azul e a errada fica vermelha, com a letra correta indicada.':'O gabarito aparece somente ao final da prova.'}</li><li>Quantidade mínima de acertos para aprovação: <b>${min}</b> (70%).</li><li>Este simulado não substitui a prova oficial do DETRAN|ES.</li></ul>
<label>Nome do candidato<input id="nm" autocomplete="name" placeholder="Digite seu nome"></label><button class="b g" id="bk">Voltar</button> <button class="b" id="go">Iniciar Simulado</button>`;
$('#bk').onclick=home;
$('#go').onclick=()=>begin($('#nm').value.trim()||'Candidato');}
function begin(nome,tipo,lib){if(lib&&M.time)M=Object.assign({},M,{time:100});S={m:M,nome,tipo,qs:sh(mk()).slice(0,M.n).map(q=>({t:q[0],g:q[5],o:sh(q.slice(1,5).map((x,i)=>({x,c:!i})))})),sel:[],r:[],rev:[],i:0,T:M.time*60,t:M.time*60,fim:0,v:'q'};
S.el=0;S.timer=setInterval(()=>{S.el++;if(M.time){S.t--;if(S.t<=0){upd();return finish()}}upd()},1000);draw()}
function cert(){const n=S.qs.length,ac=S.qs.filter((_,k)=>ok(k)).length,min=Math.ceil(n*.7);app.className='pg';
app.innerHTML=`<div class="ce"><h1>Certificado de Simulado</h1><p>Certificamos que <b>${S.nome.replace(/[<>&]/g,'')}</b> realizou o simulado “${S.m.nome}”${S.tipo?' ('+S.tipo+')':''}, obtendo <b>${ac} de ${n}</b> acertos em ${fmt(S.el)}.</p><p>Resultado: <b>${ac>=min?'APROVADO':'REPROVADO'}</b> (mínimo: ${min}).</p><p class="lg">${new Date().toLocaleString('pt-BR')} · Documento de treino, sem valor oficial.</p></div><div class="row"><button class="b" id="pr">Imprimir / salvar PDF</button><button class="b g" id="b2">Voltar</button></div>`;
$('#pr').onclick=()=>print();$('#b2').onclick=result}
function cpfOk(c){c=c.replace(/\D/g,'');if(c.length!=11||/^(\d)\1+$/.test(c))return 0;for(let t=9;t<11;t++){let x=0;for(let i=0;i<t;i++)x+=c[i]*(t+1-i);if((x*10%11)%10!=c[t])return 0}return 1}
function login(){if(S)clearInterval(S.timer);app.className='';$('#cnt').textContent=$('#tmr').textContent='';
app.innerHTML=`<div class="lg2"><div class="lh"><span style="font-size:34px">🧑‍💼</span>Entre com seus dados</div><div class="lf"><label for="ln">Nome</label><input type="text" id="ln" autocomplete="name"><label for="lc">CPF</label><input type="text" id="lc" inputmode="numeric" maxlength="14" autocomplete="off"><label for="lt">Tipo de Prova</label><select id="lt"><option>1ª Habilitação</option><option>Reciclagem</option><option>Atualização de CNH</option></select><span></span><label style="text-align:left"><input type="checkbox" id="lb">Prova com Libras</label><button class="ac" id="ac">Acessar</button></div><div style="text-align:center;font-size:13px;padding:8px 14px 0">${M.nome} · ${M.n} questões · ${M.time?'tempo de '+M.time+' min':'sem limite de tempo'} · mínimo de ${Math.ceil(M.n*.7)} acertos</div><div class="er" id="er"></div><div style="text-align:center"><button class="b g" id="bk">Voltar</button></div></div>`;
$('#lc').oninput=e=>{const d=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')};
$('#bk').onclick=home;
$('#ac').onclick=()=>{const n=$('#ln').value.trim(),e=$('#er');if(!n)return e.textContent='Informe o nome';if(!cpfOk($('#lc').value))return e.textContent='CPF Inválido';begin(n,$('#lt').value,$('#lb').checked)}}
const cur=i=>S.sel[i]!=null?S.sel[i]:S.r[i],ok=i=>S.r[i]!=null&&S.qs[i].o[S.r[i]].c;
function upd(){$('#cnt').textContent=S.fim?'':`${S.tipo?S.tipo+' · ':''}Perguntas respondidas: ${S.r.filter(v=>v!=null).length} de ${S.qs.length}`;$('#tmr').textContent=S.fim?'':'⏱ '+fmt(S.m.time?S.t:S.el);$('#tmr').style.color=S.m.time&&S.t<300?'#c00':''}
function nxt(){const n=S.qs.length;for(let d=1;d<n;d++){const k=(S.i+d)%n;if(S.r[k]==null){S.i=k;S.v='q';return draw()}}S.v='sum';draw()}
function draw(){if(S.v=='sum')return summary();upd();app.className='';
const i=S.i,q=S.qs[i],n=S.qs.length,lk=S.fim||(S.m.fb&&S.r[i]!=null),c=q.o.findIndex(o=>o.c),v=cur(i);
const fb=lk?`<p><b>${S.r[i]==null?'Sem resposta.':ok(i)?'Você acertou!':'Você errou.'}</b><br>Resposta correta: alternativa ${c+1} (letra ${L[c]}).</p>`:'';
app.innerHTML=`<div class="qc"><div class="qt">Questão nº ${i+1} - ${q.t}</div>${q.g?`<div class="sg">${q.g}</div>`:''}</div>
<div class="bt"><div><div class="hd">Escolha uma das alternativas abaixo.</div>${q.o.map((o,k)=>{let cl='ro';if(lk){if(o.c)cl+=' ok';else if(S.r[i]===k)cl+=' bad'}else if(v===k)cl+=' on';
return`<div class="${cl}" data-k="${k}" tabindex="0" role="radio" aria-checked="${v===k}"><span class="nb">${k+1}</span><span class="tx">${o.x}</span></div>`}).join('')}</div>
<div class="sd">${fb}${S.fim?`<button class="pl" id="pv" ${i?'':'disabled'}>Anterior</button><button class="cf" id="nx" ${i<n-1?'':'disabled'}>Próxima</button><button class="pl" id="rs">Ver resultado</button>`:lk?`<button class="cf" id="nx">Próxima questão</button>`:`<p>${v==null?'Escolha uma alternativa.':`Você respondeu a alternativa ${v+1}. Deseja prosseguir?`}</p><button class="cf" id="cf" ${v==null?'disabled':''}>Confirmar</button><button class="pl" id="pl">Pular questão</button>`}</div></div>`;
const g=(s,f)=>{const e=$(s);if(e)e.onclick=f};
const pick=e=>{if(!lk){S.sel[i]=+e.dataset.k;draw()}};
document.querySelectorAll('.ro').forEach(e=>{e.onclick=()=>pick(e);e.onkeydown=ev=>{if(ev.key==' '||ev.key=='Enter'){ev.preventDefault();pick(e)}}});
g('#cf',()=>{S.r[i]=v;delete S.sel[i];S.rev[i]=0;S.m.fb?draw():nxt()});
g('#pl',()=>{S.rev[i]=1;nxt()});
g('#nx',()=>{if(S.fim){S.i++;draw()}else nxt()});
g('#pv',()=>{S.i--;draw()});g('#rs',result)}
function summary(){const n=S.qs.length,f=S.qs.map((_,k)=>k).filter(k=>S.r[k]==null);upd();app.className='pg';
app.innerHTML=`<h1>Resumo da prova</h1><p>Respondidas: <b>${n-f.length}</b> de ${n}.${f.length?` Sem resposta: questão(ões) ${f.map(k=>k+1).join(', ')}.`:''}</p><div class="row">${f.length?'<button class="b g" id="bq">Voltar às questões sem resposta</button>':''}<button class="b" id="fn">Finalizar prova</button></div>`;
const b=$('#bq');if(b)b.onclick=()=>{S.i=f[0];S.v='q';draw()};
$('#fn').onclick=()=>{if(!f.length||confirm(`Ainda há ${f.length} questão(ões) sem resposta. Deseja finalizar mesmo assim?`))finish()}}
function finish(){clearInterval(S.timer);S.fim=1;S.v='q';upd();result()}
function result(){const n=S.qs.length,ac=S.qs.filter((_,k)=>ok(k)).length,min=Math.ceil(n*.7),p=ac>=min,br=S.qs.filter((_,k)=>S.r[k]==null).length;
app.className='pg';app.innerHTML=`<div class="res"><p class="lg">${S.nome.replace(/[<>&]/g,'')}${S.tipo?' · '+S.tipo:''}</p><div class="n">${ac}/${n}</div><h1 style="color:var(${p?'--bl':'--rd'})">${p?'APROVADO':'REPROVADO'}</h1><p>${p?'Você atingiu o mínimo de '+min+' acertos.':'Mínimo exigido: '+min+' acertos. Revise o conteúdo e tente novamente.'}<br>Erros: ${n-ac-br} · Em branco: ${br} · Tempo: ${fmt(S.el)}</p>
<button class="b" id="rv">Revisar questões</button> <button class="b g" id="ct">Certificado</button> <button class="b g" id="rt">Voltar ao início</button></div>`;
$('#rv').onclick=()=>{S.i=0;draw()};$('#rt').onclick=home;$('#ct').onclick=cert}
home();
</script>
</body>
</html>
